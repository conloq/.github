name: Mash logbook

on:
  pull_request:
    paths:
      - ".github/workflows/mash-logbook.yml"
      - "automation/mash_logbook/**"
      - "tests/mash_logbook/**"
  workflow_dispatch:
    inputs:
      since:
        description: "Primeiro dia (AAAA-MM-DD); vazio usa a semana anterior"
        required: false
        type: string
      until:
        description: "Último dia, inclusive (AAAA-MM-DD); vazio usa a semana anterior"
        required: false
        type: string
      dry_run:
        description: "Gerar e mostrar no resumo da execução sem abrir Pull Request"
        required: true
        default: true
        type: boolean
      check_project_access:
        description: "Verificar somente se MASH_PROJECT_TOKEN lê o Project Mash"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

concurrency:
  group: mash-logbook
  cancel-in-progress: false

jobs:
  logbook:
    name: Generate Mash logbook
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout central automation
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run regression tests
        run: python -m pytest -q tests/mash_logbook

      - name: Check Project Mash read access
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_project_access }}
        env:
          GH_TOKEN: ${{ secrets.MASH_PROJECT_TOKEN }}
        shell: bash
        run: |
          query='query { organization(login:"conloq") { projectV2(number:2) { title fields(first:50) { nodes { ... on ProjectV2IterationField { name configuration { iterations { title startDate duration } completedIterations { title startDate duration } } } } } } } }'
          gh api graphql -f query="$query" --jq '
            .data.organization.projectV2 as $project
            | [$project.fields.nodes[] | select(.name == "Sprint")] as $sprints
            | if $project.title == "Mash" and ($sprints | length) == 1 and $sprints[0].configuration != null
              then "Project Mash: leitura OK; configuração Sprint acessível."
              else error("Não foi possível ler a configuração Sprint do Project Mash.")
              end
          '

      - name: Generate and publish the diaries
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !inputs.check_project_access) }}
        env:
          MASH_PROJECT_TOKEN: ${{ secrets.MASH_PROJECT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          # Agendado publica; manual só publica com dry_run desmarcado.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # Agendado processa as sprints encerradas; manual usa as datas informadas.
          SPRINT: ${{ github.event_name == 'schedule' }}
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$SPRINT" == "true" ]]; then
            args+=(--sprint)
          elif [[ -n "$SINCE" && -n "$UNTIL" ]]; then
            args+=(--since "$SINCE" --until "$UNTIL")
          fi
          if [[ "$DRY_RUN" != "true" ]]; then args+=(--publish); fi
          python -m automation.mash_logbook.main "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
